services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    restart: unless-stopped
    # Port exposed only to other containers (not host) for production.
    # Uncomment the lines below to expose the backend directly for debugging.
    # ports:
    #   - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
